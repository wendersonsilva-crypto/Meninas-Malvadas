<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Meninas Malvadas test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #262024 0%, #120f11 100%);
      transition: background 1.2s ease-in-out;
    }

    body.book-opened-bg {
      background: #ffffff;
    }

    .scene {
      perspective: 1400px;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    /* Dimensões otimizadas para tela vertical de celular */
    .book {
      position: relative;
      width: min(86vw, 360px);
      max-height: 76dvh;
      aspect-ratio: 720 / 950;
      transform-style: preserve-3d;
      transition: transform 1.25s cubic-bezier(0.25, 1, 0.35, 1), opacity 0.8s ease;
      transform: rotateY(-5deg) rotateX(2deg);
    }

    .book:hover:not(.is-open) {
      transform: rotateY(-2deg) rotateX(1deg) scale(1.015);
    }

    .book.is-open {
      transform: translateX(48%) rotateY(0deg) rotateX(0deg);
    }

    /* Ajuste específico de abertura para telas de celular */
    @media (max-width: 640px) {
      .book {
        width: min(85vw, 340px);
      }

      .book.is-open {
        transform: translateX(50%) scale(0.95) rotateY(0deg) rotateX(0deg);
      }

      .kiss-hotspot {
        width: 34%;
        height: 18%;
      }
    }

    .book-shadow {
      position: absolute;
      inset: 10px -10px -14px 6px;
      background: rgba(0, 0, 0, 0.65);
      filter: blur(20px);
      border-radius: 10px;
      transform: translateZ(-25px);
      transition: opacity 0.8s ease;
      pointer-events: none;
    }

    .book.is-open .book-shadow {
      opacity: 0.12;
    }

    .book-pages-edge {
      position: absolute;
      top: 4px;
      bottom: 4px;
      right: -10px;
      width: 12px;
      background: repeating-linear-gradient(
        to right,
        #f5f3ef 0px,
        #e5e0d8 1px,
        #ffffff 2px
      );
      transform: rotateY(90deg) translateZ(-5px);
      border-radius: 0 3px 3px 0;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.15);
    }

    /* Lombada esquerda do livro */
    .book-spine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -12px;
      width: 14px;
      background: linear-gradient(90deg, #b84b68 0%, #e46c8b 45%, #c75372 100%);
      transform: rotateY(-90deg) translateZ(6px);
      border-radius: 4px 0 0 4px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.25);
    }

    /* Página interna branca */
    .inside-page {
      position: absolute;
      inset: 2px;
      background: #ffffff;
      border-radius: 2px 10px 10px 2px;
      box-shadow:
        inset 16px 0 26px -10px rgba(0, 0, 0, 0.14),
        0 4px 20px rgba(0, 0, 0, 0.08);
      transform: translateZ(-1px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .inside-page::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 0, 0, 0.025) 1px, transparent 0);
      background-size: 16px 16px;
      pointer-events: none;
    }

    /* Capa articulada */
    .cover-wrapper {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 1.4s cubic-bezier(0.32, 0.04, 0.22, 1);
      z-index: 10;
    }

    .book.is-open .cover-wrapper {
      transform: rotateY(-180deg);
    }

    /* Frente da Capa */
    .cover-front {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 3px 12px 12px 3px;
      overflow: visible;
      background-color: #eb7392;
      box-shadow:
        inset 8px 0 16px rgba(0, 0, 0, 0.22),
        inset -2px 0 4px rgba(255, 255, 255, 0.35),
        0 10px 25px rgba(0, 0, 0, 0.45);
      cursor: default;
    }

    .cover-front::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 20px;
      border-radius: 3px 0 0 3px;
      background: linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.28) 0%,
        rgba(255, 255, 255, 0.18) 28%,
        rgba(0, 0, 0, 0.14) 55%,
        transparent 100%
      );
      z-index: 3;
      pointer-events: none;
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 3px 12px 12px 3px;
      pointer-events: none;
    }

    .cover-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
      border-radius: 12px 3px 3px 12px;
      background: linear-gradient(135deg, #fce7ee 0%, #f7d2df 100%);
      box-shadow: inset -14px 0 24px -10px rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(235, 115, 146, 0.25);
      pointer-events: none;
    }

    .kiss-hotspot {
      position: absolute;
      top: 48.5%;
      left: 53.5%;
      width: 30%;
      height: 16%;
      transform: translate(-50%, -50%) translateZ(15px);
      border-radius: 50%;
      cursor: pointer;
      z-index: 100;
      pointer-events: auto;
      background: transparent;
      border: none;
      outline: none;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .kiss-hotspot::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid rgba(225, 29, 72, 0.55);
      opacity: 0;
      transform: scale(0.92);
      animation: kissPulse 2.4s infinite ease-out;
      pointer-events: none;
    }

    .kiss-hotspot:active,
    .kiss-hotspot:hover,
    .kiss-hotspot:focus-visible {
      transform: translate(-50%, -50%) translateZ(18px) scale(1.05);
      box-shadow: 0 0 22px rgba(225, 29, 72, 0.55);
      background: radial-gradient(ellipse at center, rgba(255, 228, 235, 0.28) 0%, rgba(225, 29, 72, 0.1) 65%, transparent 100%);
    }

    @keyframes kissPulse {
      0% {
        opacity: 0.8;
        transform: scale(0.9);
      }
      70% {
        opacity: 0;
        transform: scale(1.25);
      }
      100% {
        opacity: 0;
        transform: scale(1.25);
      }
    }

    /* Tela interna em modo mobile */
    .white-page-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #ffffff;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.75s ease-in-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      overflow-y: auto;
    }

    .white-page-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    @keyframes shakeHint {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .shake-hint {
      animation: shakeHint 0.35s ease-in-out;
    }
  </style>
</head>
<body>

  <main class="scene" id="scene">
    
    <div id="topHint" class="fixed top-6 left-1/2 -translate-x-1/2 z-30 text-center pointer-events-none transition-opacity duration-500 w-full px-4">
      <span class="inline-block bg-black/50 backdrop-blur-xs text-pink-200 text-xs font-medium px-3.5 py-1.5 rounded-full border border-pink-400/25">
        Toque no beijo para abrir 💋
      </span>
    </div>

    <div class="book" id="book">
      <div class="book-shadow"></div>
      <div class="book-spine"></div>
      <div class="book-pages-edge"></div>

      <div class="inside-page">
        <div class="w-full h-full bg-white"></div>
      </div>

      <div class="cover-wrapper" id="coverWrapper">
        <!-- Frente da Capa -->
        <div class="cover-front" id="coverFront">
          <img
            src="download (6).jpg"
            alt="Capa do Burn Book"
            class="cover-image"
            id="coverImg"
          />

          <button
            type="button"
            id="kissHotspot"
            class="kiss-hotspot group"
            aria-label="Toque no beijo para abrir o livro"
            title="Toque no beijo para abrir"
          >
            <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 absolute -top-9 left-1/2 -translate-x-1/2 whitespace-nowrap bg-black/80 text-white text-[11px] font-medium px-2.5 py-1 rounded-full shadow-md pointer-events-none">
              Abrir livro 💋
            </span>
          </button>
        </div>

        <div class="cover-back"></div>
      </div>
    </div>

    <div
      id="missToast"
      class="fixed bottom-8 left-1/2 -translate-x-1/2 z-40 opacity-0 pointer-events-none transition-all duration-300 translate-y-2 w-max max-w-[90vw]"
    >
      <div class="bg-black/80 backdrop-blur-xs text-pink-100 text-xs font-medium px-4 py-2 rounded-full border border-pink-400/30 shadow-lg">
        Toque exatamente na marca de beijo 💋
      </div>
    </div>
  </main>

  <section id="whitePageScreen" class="white-page-screen" aria-hidden="true">
    <button
      type="button"
      id="resetBtn"
      class="fixed top-4 right-4 z-50 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-neutral-100 hover:bg-neutral-200 active:scale-95 text-neutral-700 text-xs font-medium border border-neutral-200 shadow-sm transition-all cursor-pointer"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      Fechar livro
    </button>

    <div id="whitePageContent" class="w-full max-w-md mx-auto text-center">
      <!-- Conteúdo interno do livro para celular -->
    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const book = document.getElementById('book');
      const kissHotspot = document.getElementById('kissHotspot');
      const coverFront = document.getElementById('coverFront');
      const topHint = document.getElementById('topHint');
      const missToast = document.getElementById('missToast');
      const whitePageScreen = document.getElementById('whitePageScreen');
      const resetBtn = document.getElementById('resetBtn');

      let isOpening = false;
      let toastTimeout = null;
      let transitionTimeout = null;

      function showMissHint() {
        if (isOpening) return;

        clearTimeout(toastTimeout);
        missToast.classList.remove('opacity-0', 'translate-y-2');
        missToast.classList.add('opacity-100', 'translate-y-0');

        topHint.classList.remove('shake-hint');
        void topHint.offsetWidth; 
        topHint.classList.add('shake-hint');

        toastTimeout = setTimeout(() => {
          missToast.classList.add('opacity-0', 'translate-y-2');
          missToast.classList.remove('opacity-100', 'translate-y-0');
        }, 2200);
      }

      coverFront.addEventListener('click', (e) => {
        if (e.target !== kissHotspot && !kissHotspot.contains(e.target)) {
          showMissHint();
        }
      });

      kissHotspot.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isOpening) return;
        isOpening = true;

        topHint.style.opacity = '0';
        missToast.classList.add('opacity-0');

        book.classList.add('is-open');

        setTimeout(() => {
          document.body.classList.add('book-opened-bg');
        }, 450);

        transitionTimeout = setTimeout(() => {
          whitePageScreen.classList.add('active');
          whitePageScreen.setAttribute('aria-hidden', 'false');
        }, 1150);
      });

      resetBtn.addEventListener('click', () => {
        clearTimeout(transitionTimeout);
        whitePageScreen.classList.remove('active');
        whitePageScreen.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('book-opened-bg');

        setTimeout(() => {
          book.classList.remove('is-open');
          topHint.style.opacity = '1';
          isOpening = false;
        }, 300);
      });
    });
  </script>
</body>
</html>
