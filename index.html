<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YOU CAN'T SIT WITH US? — Pertencer enquanto se tornar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Poppins:wght@400;500;600;700;800&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rosa-chiclete: #F5A8C8;
      --pink: #E94B91;
      --rosa-claro: #F8DCE8;
      --papel: #FFF5E9;
      --preto: #211A25;
      --lilas: #A88BD6;
      --azul: #78BBD1;
      --amarelo: #F4D85B;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 24 24'><path fill='%23E94B91' stroke='%23211A25' stroke-width='1.8' d='M4 2l14 11.5-6.2 1.2 3.4 6.5-2.7 1.4-3.4-6.5L4 20V2z'/></svg>") 4 2, auto;
    }

    button, a, [role="button"], .interactive-hotspot, .board-block-btn {
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24'><path fill='%23F5A8C8' stroke='%23211A25' stroke-width='1.8' d='M9 2v9H7V8H5v7l3 6h9l2-8v-3h-2V9h-2V8h-2V2H9z'/></svg>") 9 2, pointer !important;
    }

    body {
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
      color: var(--preto);
      background-color: var(--rosa-chiclete);
      overflow: hidden;
      touch-action: manipulation;
    }

    .font-editorial { font-family: 'Playfair Display', serif; }
    .font-hand { font-family: 'Caveat', cursive; }
    .font-pixel { font-family: 'Press Start 2P', monospace; }
    .font-poppins { font-family: 'Poppins', sans-serif; }
    .font-mono-tag { font-family: 'Space Mono', monospace; }

    .y2k-sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 14px;
      user-select: none;
      animation: sparkleFloat 0.85s ease-out forwards;
    }

    @keyframes sparkleFloat {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, 16px) scale(0.3) rotate(45deg);
      }
    }

    .scene {
      perspective: 1400px;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    .book {
      position: relative;
      width: min(82vw, 380px);
      max-height: 76dvh;
      aspect-ratio: 720 / 950;
      transform-style: preserve-3d;
      transition: transform 1.25s cubic-bezier(0.25, 1, 0.35, 1), opacity 0.8s ease;
      transform: rotateY(-5deg) rotateX(2deg);
    }

    .book:hover:not(.is-open) {
      transform: rotateY(-2deg) rotateX(1deg) scale(1.015);
    }

    .book.is-open {
      transform: translateX(48%) rotateY(0deg) rotateX(0deg);
    }

    @media (max-width: 768px) {
      .book {
        width: min(84vw, 350px);
        max-height: 74dvh;
      }
      .book.is-open {
        transform: translateX(45%) scale(0.88) rotateY(0deg) rotateX(0deg);
      }
      .kiss-hotspot {
        width: 36%;
        height: 20%;
      }
    }

    .book-shadow {
      position: absolute;
      inset: 10px -10px -14px 6px;
      background: rgba(33, 26, 37, 0.35);
      filter: blur(20px);
      border-radius: 10px;
      transform: translateZ(-25px);
      transition: opacity 0.8s ease;
      pointer-events: none;
    }

    .book.is-open .book-shadow { opacity: 0.12; }

    .book-pages-edge {
      position: absolute;
      top: 4px;
      bottom: 4px;
      right: -10px;
      width: 12px;
      background: repeating-linear-gradient(to right, #FFF5E9 0px, #d6cbbd 1px, #FFF5E9 2px);
      transform: rotateY(90deg) translateZ(-5px);
      border-radius: 0 3px 3px 0;
    }

    .book-spine {
      display: none;
    }

    .inside-page {
      position: absolute;
      inset: 2px;
      background-color: #FFF5E9;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 22px,
        #d6cbbd 23px,
        #d6cbbd 24px
      );
      border-radius: 2px 10px 10px 2px;
      transform: translateZ(-1px);
      overflow: hidden;
    }

    .flip-page {
      position: absolute;
      inset: 3px;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 0.78s cubic-bezier(0.28, 0.08, 0.22, 1);
      pointer-events: none;
    }

    .flip-page.flipped { transform: rotateY(-178deg); }

    .flip-page-front, .flip-page-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 2px 10px 10px 2px;
      background-color: #FFF5E9;
      box-shadow: inset 12px 0 20px -10px rgba(0, 0, 0, 0.12), 1px 0 4px rgba(0, 0, 0, 0.06);
      border-right: 1px solid #d6cbbd;
    }

    .flip-page-front::before,
    .flip-page-back::before {
      content: "";
      position: absolute;
      top: 10%;
      bottom: 10%;
      left: 10%;
      right: 10%;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 20px,
        #d6cbbd 21px,
        #d6cbbd 22px
      );
    }

    .flip-page-back {
      transform: rotateY(180deg);
      border-radius: 10px 2px 2px 10px;
      background-color: #FFF5E9;
      border-right: none;
      border-left: 1px solid #d6cbbd;
    }

    .cover-wrapper {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 0.95s cubic-bezier(0.32, 0.04, 0.22, 1);
      z-index: 20;
    }

    .book.is-open .cover-wrapper { transform: rotateY(-180deg); }

    .cover-front {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 3px 12px 12px 3px;
      background-color: var(--rosa-chiclete);
      box-shadow: inset 8px 0 16px rgba(0, 0, 0, 0.22), 0 10px 25px rgba(33, 26, 37, 0.35);
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 3px 12px 12px 3px;
      pointer-events: none;
    }

    .cover-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
      border-radius: 12px 3px 3px 12px;
      background: linear-gradient(135deg, #fce7ee 0%, var(--rosa-chiclete) 100%);
    }

    .kiss-hotspot {
      position: absolute;
      top: 48.5%;
      left: 53.5%;
      width: 30%;
      height: 16%;
      transform: translate(-50%, -50%) translateZ(15px);
      border-radius: 50%;
      z-index: 100;
      background: transparent;
      border: none;
    }

    .canvas-stage-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.75s ease-in-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--rosa-chiclete);
      padding: 6px;
      overflow: hidden;
    }

    .canvas-stage-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .main-browser-shell {
      position: relative;
      width: min(98vw, calc((100dvh - 48px) * (1980 / 1080)));
      background: var(--papel);
      border: 2.5px solid var(--preto);
      border-radius: 12px 12px 8px 8px;
      box-shadow: 0 20px 50px rgba(33, 26, 37, 0.35), 5px 5px 0px var(--pink);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    .retro-window-header {
      height: 36px;
      background: linear-gradient(90deg, var(--rosa-claro) 0%, var(--rosa-chiclete) 52%, var(--pink) 100%);
      border-bottom: 2px solid var(--preto);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 12px;
      flex-shrink: 0;
      position: relative;
      z-index: 45;
    }

    .retro-win-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
      z-index: 50;
    }

    .retro-btn-box {
      width: 26px;
      height: 22px;
      border: 1.5px solid var(--preto);
      border-radius: 3px;
      background: linear-gradient(180deg, var(--papel) 0%, var(--rosa-claro) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      color: var(--preto);
    }

    .retro-btn-close {
      width: 34px;
      height: 22px;
      border: 1.5px solid var(--preto);
      border-radius: 3px;
      background: var(--pink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: var(--papel);
    }

    .retro-btn-close:hover {
      background: var(--preto);
    }

    .diary-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 1980 / 1080;
      overflow: hidden;
    }

    .diary-board {
      position: relative;
      width: 100%;
      height: 100%;
      container-type: inline-size;
      transition: transform 0.45s cubic-bezier(0.25, 1, 0.35, 1);
    }

    .diary-board-bg {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }

    .board-block-btn {
      position: absolute;
      background: transparent;
      border: none;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background-color 0.2s ease;
      overflow: hidden;
    }

    .board-block-btn:hover {
      transform: translateY(-1px) scale(1.012);
      box-shadow: 0 4px 12px rgba(233, 75, 145, 0.24);
      background-color: rgba(255, 255, 255, 0.22);
    }

    .board-block-btn:active {
      transform: scale(0.985);
    }

    .block-hero-featured {
      left: 14.2%;
      top: 40.9%;
      width: 31.7%;
      height: 10.5%;
      padding: 0.4cqw 1.1cqw;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 0.85cqw;
      text-align: left;
      border-radius: 2px;
    }

    .block-hero-heart {
      font-size: 1.4cqw;
      color: #E94B91;
      font-weight: 800;
      line-height: 1;
      flex-shrink: 0;
    }

    .block-hero-text {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 0.88cqw;
      color: #211A25;
      line-height: 1.28;
      text-align: left;
    }

    .block-grid-card {
      width: 15.0%;
      height: 9.8%;
      padding: 1.2cqw 0.85cqw 0.35cqw;
      justify-content: flex-start;
      border-radius: 2px;
      margin-top: 0.7%;
    }

    .block-card-kicker {
      font-family: 'Space Mono', monospace;
      font-size: 0.54cqw;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6F5F75;
      line-height: 1.15;
      margin-bottom: 0.2cqw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .block-card-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 0.94cqw;
      color: var(--preto);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .press-start-btn {
      position: absolute;
      top: 43.2%;
      left: 70.6%;
      transform: translate(-50%, -50%);
      background-color: var(--pink);
      color: var(--papel);
      border: 2px solid var(--preto);
      box-shadow: 3px 3px 0px var(--preto);
      border-radius: 8px;
      padding: 0.55cqw 1.05cqw;
      text-align: center;
      z-index: 25;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
      white-space: nowrap;
    }

    .press-start-btn:hover {
      background-color: var(--lilas);
      transform: translate(-50%, -53%) scale(1.03);
      box-shadow: 4px 4px 0px var(--preto);
    }

    .press-start-btn:active {
      transform: translate(-50%, -48%) scale(0.98);
      box-shadow: 1px 1px 0px var(--preto);
    }

    .press-start-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.74cqw;
      display: block;
      color: var(--papel);
    }

    .interactive-hotspot {
      position: absolute;
      background: transparent;
      border: none;
      padding: 0;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
    }

    .interactive-hotspot:hover {
      transform: scale(1.09) rotate(-2deg);
      filter: drop-shadow(0 0 10px rgba(233, 75, 145, 0.85));
    }

    .interactive-hotspot:active {
      transform: scale(0.95);
    }

    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .cd-hotspot-circle {
      position: absolute;
      left: 88.4%;
      top: 13.7%;
      height: 26.8%;
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: transparent;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.25s ease;
    }

    .cd-hotspot-circle:hover {
      filter: drop-shadow(0 0 10px rgba(233, 75, 145, 0.85));
    }

    .cd-playing-ring {
      width: 96%;
      height: 96%;
      border-radius: 50%;
      border: 2px dashed rgba(233, 75, 145, 0.65);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cd-playing-ring.spinning {
      opacity: 1;
      animation: spinDisc 5s linear infinite;
    }

    .pink-speech-bubble {
      position: absolute;
      background: linear-gradient(135deg, var(--rosa-claro) 0%, var(--rosa-chiclete) 100%);
      color: var(--preto);
      border: 2px solid var(--preto);
      box-shadow: 4px 4px 0px var(--pink);
      border-radius: 16px;
      padding: 8px 14px;
      font-weight: 800;
      opacity: 0;
      transform: translateY(8px) scale(0.95);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 40;
    }

    .pink-speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -9px;
      left: 22px;
      border-width: 9px 8px 0;
      border-style: solid;
      border-color: var(--preto) transparent transparent transparent;
    }

    .hotspot-group:hover .pink-speech-bubble,
    .hotspot-group.is-bubble-open .pink-speech-bubble {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .mobile-page-nav {
      display: none;
    }

    @media (max-width: 768px) and (orientation: portrait) {
      .canvas-stage-screen {
        padding: 8px;
      }
      .main-browser-shell {
        width: min(96vw, calc((100dvh - 88px) * (990 / 1080)));
      }
      .diary-viewport {
        aspect-ratio: 990 / 1080;
      }
      .diary-board {
        width: 200%;
        height: 100%;
        transform: translateX(0%);
      }
      .diary-board.show-right-page {
        transform: translateX(-50%);
      }
      .mobile-page-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: min(96vw, calc((100dvh - 88px) * (990 / 1080)));
        margin-top: 8px;
        background: var(--papel);
        border: 2px solid var(--preto);
        border-radius: 10px;
        padding: 6px 8px;
        box-shadow: 4px 4px 0px var(--pink);
      }
      .mobile-tab-btn {
        flex: 1;
        padding: 7px 6px;
        border-radius: 7px;
        border: 1.5px solid var(--preto);
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
        text-align: center;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .mobile-tab-btn.active {
        background-color: var(--pink);
        color: var(--papel);
      }
      .mobile-tab-btn:not(.active) {
        background-color: var(--rosa-claro);
        color: var(--preto);
      }
      .pink-speech-bubble {
        padding: 7px 11px;
        font-size: 11px !important;
        max-width: 245px !important;
      }
    }

    .browser-tab-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(33, 26, 37, 0.28);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0.65rem;
    }

    .browser-tab-overlay.open {
      display: flex;
    }

    .retro-browser-window {
      position: relative;
      width: min(95vw, 620px);
      max-height: 88dvh;
      background: var(--rosa-claro);
      border: 2.5px solid var(--preto);
      border-radius: 10px 10px 6px 6px;
      box-shadow: 0 18px 45px rgba(33, 26, 37, 0.45), 6px 6px 0px var(--pink);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease, width 0.25s ease;
    }

    .retro-window-body {
      margin: 6px;
      background: var(--papel);
      border: 1.5px solid var(--preto);
      padding: 1.15rem;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
    }

    .burnbook-sheet,
    .diary-sheet {
      position: relative;
      background-color: #FCF6F7;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 27px,
        rgba(226, 198, 206, 0.55) 28px
      );
      border: 1.5px solid #E5C6CF;
      border-radius: 12px;
      padding: 1.25rem 1.15rem 1.4rem;
      overflow: hidden;
    }

    .burnbook-corner-pink {
      position: absolute;
      top: -28px;
      left: -28px;
      width: 115px;
      height: 85px;
      background: rgba(245, 168, 200, 0.38);
      border-radius: 50%;
      pointer-events: none;
    }

    .burnbook-corner-pink-br {
      position: absolute;
      bottom: -34px;
      right: -28px;
      width: 130px;
      height: 95px;
      background: rgba(245, 168, 200, 0.38);
      border-radius: 50%;
      pointer-events: none;
    }

    .burnbook-postit {
      background: linear-gradient(145deg, #F9D2DF 0%, #F4BED0 100%);
      border: 1px solid rgba(212, 128, 159, 0.55);
      box-shadow: 3px 4px 10px rgba(33, 26, 37, 0.14);
      transform: rotate(3.2deg);
      padding: 10px 14px;
      border-radius: 3px;
      position: relative;
    }

    .diary-postit-lilac {
      background: linear-gradient(145deg, #EADCF8 0%, #D9C2F0 100%);
      border: 1px solid rgba(168, 139, 214, 0.65);
      box-shadow: 3px 4px 10px rgba(33, 26, 37, 0.14);
      transform: rotate(3deg);
      padding: 10px 14px;
      border-radius: 3px;
    }

    .moodboard-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(248, 220, 232, 0.85);
      border: 1.5px solid #DFB0C1;
      border-radius: 999px;
      padding: 7px 14px;
      font-family: 'Poppins', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      color: #211A25;
      transition: transform 0.18s ease, background-color 0.18s ease;
    }

    .moodboard-pill:hover {
      background: #F5A8C8;
      transform: translateX(3px);
    }

    .moodboard-plus {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid #211A25;
      background: #FFF5E9;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .moodboard-box {
      background: linear-gradient(180deg, #F8C6D8 0%, #F5A8C8 100%);
      border: 2px solid #211A25;
      box-shadow: 4px 4px 0px #E94B91;
      border-radius: 14px;
      padding: 14px;
    }

    .sheet-list-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 4px;
      border-bottom: 1px dashed rgba(217, 134, 162, 0.6);
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      color: #211A25;
      line-height: 1.45;
    }

    .sheet-list-row:last-child {
      border-bottom: none;
    }

    let activeTabKey = null;

    /* ============================================================
       INTEGRAÇÃO SPOTIFY IFRAME API + CONTROLE COM JINGLE BELL ROCK
       ============================================================ */
    let spotifyEmbedController = null;
    let isSpotifyPlaying = false;
    let isSpotifyInitialized = false;

    function initSpotifyController(IFrameAPI) {
      if (isSpotifyInitialized) return;
      const target = document.getElementById('spotifyEmbedTarget');
      if (!target || !IFrameAPI) return;

      isSpotifyInitialized = true;
      IFrameAPI.createController(
        target,
        {
          uri: SPOTIFY_PLAYLIST_URI,
          width: '100%',
          height: '152'
        },
        (EmbedController) => {
          spotifyEmbedController = EmbedController;
          EmbedController.addListener('playback_update', (e) => {
            if (e && e.data) {
              const playingNow = !e.data.isPaused;
              if (playingNow && !isSpotifyPlaying) {
                // Uma música do Spotify foi iniciada -> para o Jingle Bell Rock
                stopMusic();
              }
              isSpotifyPlaying = playingNow;
            }
          });
        }
      );
    }

    window.onSpotifyIframeApiReady = (IFrameAPI) => {
      initSpotifyController(IFrameAPI);
    };

    function ensureSpotifyFallbackIframe() {
      const target = document.getElementById('spotifyEmbedTarget');
      if (target && !isSpotifyInitialized && !target.querySelector('iframe')) {
        target.innerHTML = `
          <iframe
            style="border-radius:10px"
            src="https://open.spotify.com/embed/playlist/2BDxSjCOejZv21uXdIJpME?utm_source=generator"
            width="100%"
            height="152"
            frameBorder="0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy"
          ></iframe>
        `;
      }
    }

    function toggleSpotifyDock() {
      const dock = document.getElementById('spotifyDockWindow');
      if (!dock) return;
      ensureSpotifyFallbackIframe();

      if (dock.classList.contains('is-visible')) {
        if (dock.classList.contains('is-minimized')) {
          dock.classList.remove('is-minimized');
        } else {
          dock.classList.remove('is-visible');
        }
      } else {
        dock.classList.remove('is-minimized');
        dock.classList.add('is-visible');
      }
    }

    function minimizeSpotifyDock() {
      const dock = document.getElementById('spotifyDockWindow');
      if (dock) dock.classList.toggle('is-minimized');
    }

    function hideSpotifyDock() {
      const dock = document.getElementById('spotifyDockWindow');
      if (dock) dock.classList.remove('is-visible');
    }

    function pauseSpotifyIfPlaying() {
      if (spotifyEmbedController && isSpotifyPlaying) {

          isSpotifyPlaying = false;

      playRetroClick();

      const btnRight = document.getElementById('btnPageRight');
      if (!board) return;

      if (side === 'right') {
        board.classList.add('show-right-page');
        if (btnRight) btnRight.classList.add('active');
        if (btnLeft) btnLeft.classList.remove('active');
      } else {
        board.classList.remove('show-right-page');
        if (btnLeft) btnLeft.classList.add('active');
        if (btnRight) btnRight.classList.remove('active');
      }
    }

    (function setupMobileSwipe() {
      const viewport = document.getElementById('diaryViewport');
      if (!viewport) return;
      let startX = 0;

      viewport.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches[0]) startX = e.touches[0].clientX;
      }, { passive: true });

      viewport.addEventListener('touchend', (e) => {
        if (!e.changedTouches || !e.changedTouches[0]) return;
        const diffX = e.changedTouches[0].clientX - startX;
        if (Math.abs(diffX) > 45) {
          if (diffX < 0) {
            setMobileDiaryPage('right');
          } else {
            setMobileDiaryPage('left');
          }
        }
      }, { passive: true });
    })();

    let uiAudioCtx = null;

    function getUiAudioCtx() {
      if (!uiAudioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) uiAudioCtx = new AudioContext();
      }
      if (uiAudioCtx && uiAudioCtx.state === 'suspended') {
        uiAudioCtx.resume();
      }
      return uiAudioCtx;
    }

    function playRetroHover() {
      try {
        const ctx = getUiAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(980, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.045);
        gain.gain.setValueAtTime(0.035, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.055);
      } catch (e) {}
    }

    function playRetroClick() {
      try {
        const ctx = getUiAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(660, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1046, ctx.currentTime + 0.075);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.085);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.09);
      } catch (e) {}
    }

    let lastSparkleTime = 0;
    const sparkleIcons = ['✦', '♡', '★', '✿'];
    const sparkleColors = ['#E94B91', '#FFF5E9', '#A88BD6', '#F4D85B'];

    function spawnSparkle(x, y) {
      const now = Date.now();
      if (now - lastSparkleTime < 65) return;
      lastSparkleTime = now;

      const el = document.createElement('span');
      el.className = 'y2k-sparkle';
      el.textContent = sparkleIcons[Math.floor(Math.random() * sparkleIcons.length)];
      el.style.color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 850);
    }

    document.addEventListener('mousemove', (e) => {
      spawnSparkle(e.clientX, e.clientY);
    });

    document.addEventListener('touchmove', (e) => {

      {
        quote: "Parece que todo mundo sabe o que está fazendo, menos eu.",
        why: "Durante a graduação, é comum ter a impressão de que as outras pessoas estão mais seguras sobre suas escolhas, seus objetivos e o futuro profissional. Nas redes sociais e nas conversas cotidianas, geralmente temos contato com as conquistas dos outros, mas pouco acesso às dúvidas, aos receios e às dificuldades que também fazem parte de suas trajetórias. Essa percepção pode alimentar comparações e produzir a sensação de estar constantemente atrás, mesmo quando não existe um parâmetro real para essa avaliação.",
        now: "Será que você conhece de verdade o percurso das pessoas com quem se compara? Cada trajetória envolve condições, oportunidades, dificuldades e tempos diferentes. Em vez de medir seu desenvolvimento pelo que os outros aparentam conquistar, experimente reconhecer o que você já construiu e compreender o que ainda deseja desenvolver. Não ter todas as respostas também faz parte do processo."
      },

        const btnCenterY = rect.top + rect.height / 2;
        const viewCenterX = window.innerWidth / 2;
        const viewCenterY = window.innerHeight / 2;
        const deltaX = btnCenterX - viewCenterX;
        const deltaY = btnCenterY - viewCenterY;

        win.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.08)`;
      } else {
        win.style.transform = 'scale(0.15)';
      }

      overlay.classList.add('open');

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          win.style.transition = 'transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.26s ease, width 0.25s ease';
          win.style.opacity = '1';
          win.style.transform = 'translate(0px, 0px) scale(1)';
        });
      });
    }

    (function setupWindowDrag() {
      const dragBar = document.getElementById('retroModalDragBar');
      const win = document.getElementById('retroBrowserWindow');
      let isDragging = false;
      let startMouseX = 0;
      let startMouseY = 0;

      dragBar.addEventListener('mousedown', (e) => {
        if (e.target.closest('button')) return;
        isDragging = true;
        startMouseX = e.clientX - dragOffsetX;
        startMouseY = e.clientY - dragOffsetY;
        win.style.transition = 'none';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        dragOffsetX = e.clientX - startMouseX;
        dragOffsetY = e.clientY - startMouseY;
        win.style.transform = `translate(${dragOffsetX}px, ${dragOffsetY}px) scale(1)`;
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
      });

      dragBar.addEventListener('touchstart', (e) => {
        if (e.target.closest('button') || !e.touches[0]) return;
        isDragging = true;
        startMouseX = e.touches[0].clientX - dragOffsetX;
        startMouseY = e.touches[0].clientY - dragOffsetY;
        win.style.transition = 'none';
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!isDragging || !e.touches[0]) return;
        dragOffsetX = e.touches[0].clientX - startMouseX;
        dragOffsetY = e.touches[0].clientY - startMouseY;
        win.style.transform = `translate(${dragOffsetX}px, ${dragOffsetY}px) scale(1)`;
      }, { passive: true });

      document.addEventListener('touchend', () => {
        isDragging = false;
      });
    })();

    function enterDiaryFromWelcome() {
      isWelcomeGateActive = false;
      closeBrowserTab();
    }

    function closeBrowserTab() {
      const overlay = document.getElementById('browserTabOverlay');
      const win = document.getElementById('retroBrowserWindow');
      win.style.transition = 'transform 0.24s ease, opacity 0.22s ease';
      win.style.opacity = '0';
      win.style.transform = `translate(${dragOffsetX}px, ${dragOffsetY}px) scale(0.15)`;
      setTimeout(() => {
        overlay.classList.remove('open');
        activeTabKey = null;
      }, 240);
    }

    function handleWindowDismiss() {
      playRetroClick();
      if (isWelcomeGateActive) {
        isWelcomeGateActive = false;
        closeFullDiary();
      } else {
        closeBrowserTab();
      }
    }

    function handleOverlayClick(event) {
      if (event.target === document.getElementById('browserTabOverlay')) {
        if (!isWelcomeGateActive) {
          closeBrowserTab();
        }
      }
    }

    document.getElementById('btnWinClose').addEventListener('click', handleWindowDismiss);
    document.getElementById('btnWinMin').addEventListener('click', handleWindowDismiss);

    document.getElementById('toggleExpandBtn').addEventListener('click', () => {
      playRetroClick();
      const win = document.getElementById('retroBrowserWindow');
      isWindowExpanded = !isWindowExpanded;
      win.style.width = isWindowExpanded ? 'min(97vw, 760px)' : 'min(95vw, 620px)';
    });

    const bgMusic = document.getElementById('bgMusic');
    if (bgMusic) bgMusic.volume = 0.45;
    let isMusicPlaying = false;

    function startMusic() {
      if (!bgMusic) return;
      pauseSpotifyIfPlaying();
      bgMusic.play().then(() => {
        isMusicPlaying = true;
        const ring = document.getElementById('cdSpinRing');
        if (ring) ring.classList.add('spinning');
      }).catch((err) => {
        console.log(err);
      });
    }

    function stopMusic() {
      if (!bgMusic) return;
      bgMusic.pause();
      isMusicPlaying = false;
      const ring = document.getElementById('cdSpinRing');
      if (ring) ring.classList.remove('spinning');
    }

    let isOpening = false;
    let flipTimeouts = [];

    function clearAllFlipTimers() {
      flipTimeouts.forEach(id => clearTimeout(id));
      flipTimeouts = [];
    }

    function closeFullDiary() {
      playRetroClick();
      clearAllFlipTimers();
      stopMusic();
      pauseSpotifyIfPlaying();
      hideSpotifyDock();
      isWelcomeGateActive = false;

      const overlay = document.getElementById('browserTabOverlay');
      if (overlay) overlay.classList.remove('open');

      const canvasStageScreen = document.getElementById('canvasStageScreen');
      const book = document.getElementById('book');
      const flipPages = Array.from(document.querySelectorAll('.flip-page')).reverse();

      canvasStageScreen.classList.remove('active');
      canvasStageScreen.setAttribute('aria-hidden', 'true');

      const reversedBack = [...flipPages].reverse();
      reversedBack.forEach((page, index) => {
        flipTimeouts.push(setTimeout(() => {
          page.classList.remove('flipped');
          setTimeout(() => { page.style.zIndex = 11 + index; }, 350);
        }, 120 + index * 70));
      });

      flipTimeouts.push(setTimeout(() => {
        book.classList.remove('is-open');
        isOpening = false;
      }, 120 + reversedBack.length * 70 + 180));
    }

    document.addEventListener('DOMContentLoaded', () => {
      const book = document.getElementById('book');
      const kissHotspot = document.getElementById('kissHotspot');
      const canvasStageScreen = document.getElementById('canvasStageScreen');
      const flipPages = Array.from(document.querySelectorAll('.flip-page')).reverse();

      kissHotspot.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isOpening) return;
        isOpening = true;
        playRetroClick();
        clearAllFlipTimers();

        book.classList.add('is-open');

        flipPages.forEach((page, index) => {
          const delay = 260 + index * 145;
          flipTimeouts.push(setTimeout(() => {
            page.style.zIndex = 25 + index;
            page.classList.add('flipped');
          }, delay));
        });

        const totalDuration = 260 + flipPages.length * 145 + 620;
        flipTimeouts.push(setTimeout(() => {
          canvasStageScreen.classList.add('active');
          canvasStageScreen.setAttribute('aria-hidden', 'false');
          startMusic();
          openBrowserTab('boasvindas', null, true);
        }, totalDuration));
      });

      document.getElementById('micMuteHotspot').addEventListener('click', () => {
        playRetroClick();
        if (isMusicPlaying || isSpotifyPlaying) {
          stopMusic();
          pauseSpotifyIfPlaying();
        } else {
          startMusic();
        }
      });

      document.getElementById('cdHotspot').addEventListener('click', () => {
        playRetroClick();
        if (bgMusic) {
          bgMusic.currentTime = 0;
          startMusic();
        }
      });
    });
  </script>
</body>
